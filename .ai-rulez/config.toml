
version = "5.0"
name = 'gitfluff'
description = 'Rust-based CLI tool for enforcing Conventional Commits 1.0.0 specification with automatic message cleanup and multi-platform distribution.'
gitignore = true
gitignore_exclude = [
  ".ai-rulez/.generated-manifest.json",
  ".claude/agents/code-reviewer.md",
  ".claude/agents/docs-writer.md",
  ".claude/agents/security-auditor.md",
  ".claude/agents/test-writer.md",
  ".claude/skills/build/SKILL.md",
  ".claude/skills/fix/SKILL.md",
  ".claude/skills/iterate/SKILL.md",
  ".claude/skills/lint/SKILL.md",
  ".claude/skills/parallelize/SKILL.md",
  ".claude/skills/review/SKILL.md",
  ".claude/skills/test/SKILL.md",
  ".codex/agents/code-reviewer.toml",
  ".codex/agents/docs-writer.toml",
  ".codex/agents/security-auditor.toml",
  ".codex/agents/test-writer.toml",
  "AGENTS.md",
  "CLAUDE.md",
]
default_layers = ["plugins"]
presets = ["claude", "codex", "opencode", "pi"]
builtins = ['rust', 'default-commands']

[mcp]
self_server_command = ["ai-rulez", "mcp"]

[lock]
include_outputs = false
