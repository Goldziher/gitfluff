version: "3"
tasks:
  build:
    desc: Build the release binary
    cmds:
      - cargo build --release --locked
  test:
    desc: Run the Rust and distribution wrapper tests
    cmds:
      - cargo test --locked
      - node --test npm-package/tests/*.test.js
      - python3 -m unittest discover -s pip-package/tests
  lint:
    desc: Lint the repository with poly
    cmds:
      - poly lint .
  format:
    desc: Format the repository with poly
    cmds:
      - poly fmt --fix .
  check:
    desc: Check formatting, lint, and run tests
    cmds:
      - poly fmt --check .
      - task: lint
      - task: test
  governance:generate:
    desc: Generate native AI governance outputs
    cmds:
      - ai-rulez generate --no-local --strict-config
  governance:check:
    desc: Validate native AI governance and freshness
    cmds:
      - ai-rulez migrate okf --check
      - ai-rulez validate --strict --no-local
      - ai-rulez lock --check
      - ai-rulez generate --check --no-local --strict-config

  governance:hooks:
    desc: Provision pinned native governance hooks
    cmds:
      - >-
        python3 -c 'from pathlib import Path;
        p = Path("poly.local.toml");
        p.exists() or p.write_text("[hook_preferences]\nchannels = [\"system\"]\n")'
      - poly hooks update
      - poly hooks install
