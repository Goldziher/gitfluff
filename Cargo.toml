[package]
authors = ["Na'aman Hirschfeld <nhirschfeld@gmail.com>"]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/README.md"]
name = "gitfluff"
version = "0.11.2"
edition = "2024"
description = "Commit message linting tool with presets, custom formats, and cleanup automation."
license = "MIT"
repository = "https://github.com/Goldziher/gitfluff"
homepage = "https://github.com/Goldziher/gitfluff"
readme = "README.md"

# Release archives hold the binary at the top level. Windows ships only the GNU build, which an
# MSVC host runs as is. `{ archive-suffix }` carries its own leading dot.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-x86_64-pc-windows-gnu{ archive-suffix }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-fmt = "zip"

[lib]
name = "gitfluff"
path = "src/lib.rs"

[[bin]]
name = "gitfluff"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# Command line interface; disable with `default-features = false` to use gitfluff as a library.
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
