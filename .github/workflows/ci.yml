name: Fluff CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    name: Toolchain baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/check-toolchain@v1

  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Check formatting
        run: cargo fmt --check
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy -- -D warnings

  test:
    name: Test
    strategy:
      matrix:
        # ~keep ubuntu-24.04, not ubuntu-latest: setup-python publishes no Python 3.8 build for Ubuntu
        # ~keep 26.04, and the wrapper test below needs the 3.8 floor.
        os: [ubuntu-24.04, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test
      - name: Build and test library without the cli feature
        run: |
          cargo build --no-default-features --lib
          cargo test --no-default-features --lib
      - uses: xberg-io/actions/setup-mise@v1
        with:
          tools: node
      # ~keep 3.11 is the oldest Python the wrapper supports; mise installs only the baseline's
      # ~keep newest line, so the floor comes from setup-python.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install wrapper dependencies
        run: |
          npm install --prefix npm-package --ignore-scripts --package-lock=false
          python -m pip install ./pip-package
      - name: Test npm wrapper
        run: node --test npm-package/tests/*.test.js
      - name: Test Python wrapper
        run: python -m unittest discover -s pip-package/tests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # ~keep No rust-toolchain.toml; this job installs the stable channel directly.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
