# Versions follow the xberg-io/toolchains baseline named in toolchains.toml. CI installs Rust with
# dtolnay/rust-toolchain; it is not pinned here. ~keep
[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "windows-x64"]

[tools]
"github:Goldziher/poly" = "0.32.1"
python = "3.15.2"
node = "26.13.0"
pnpm = "12.16.1"
actionlint = "1.7.12"

[tasks.setup]
description = "Install the toolchain, fetch Rust dependencies and install governance hooks"
run = ["mise install", "cargo fetch --locked", { task = "governance:hooks:install" }]

[tasks.build]
description = "Build the release binary"
run = "cargo build --release --locked"

[tasks.test]
description = "Run the Rust and distribution wrapper tests"
run = [
  "cargo test --locked",
  "node --test npm-package/tests/*.test.js",
  "python3 -m unittest discover -s pip-package/tests",
]

[tasks.check]
description = "Check formatting, lint, and run tests"
run = [{ task = "format:check" }, { task = "lint" }, { task = "test" }]

[tasks."governance:generate"]
description = "Generate native AI governance outputs"
run = "npx -y ai-rulez@latest generate --no-local --strict-config"

[tasks."governance:check"]
description = "Validate native AI governance and freshness"
run = [
  "npx -y ai-rulez@latest migrate okf --check",
  "npx -y ai-rulez@latest validate --strict --no-local",
  "npx -y ai-rulez@latest lock --check",
  "npx -y ai-rulez@latest generate --check --no-local --strict-config",
]

[task_config]
includes = ["mise-tasks", "mise-tasks/shared.toml"]
